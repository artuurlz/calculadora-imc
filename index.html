<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Calcular - IMC</title>
  </head>
  <body>
    <main id="main">
      <h1 class="title">Calculadora - IMC</h1>
      <div class="div_input">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" class="input" />
      </div>
      <div class="div_input">
        <label for="altura">Altura (cm):</label>
        <input type="number" id="altura" class="input" />
      </div>
      <div class="div_input">
        <label for="altura">Peso (Kg):</label>
        <input type="number" id="peso" class="input" />
      </div>
      <button class="calcular">Calcular</button>
      <section class="resultado"></section>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
